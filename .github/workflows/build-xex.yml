name: Build iPhoneTether360 1.0.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  OXC_PREFIX: ${{ github.workspace }}/.openxechain/sysroot
  OXC_BUILDSCRIPT_COMMIT: eed1fa65bf9577fd31625764b320a90182ea9ade

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install validation and OpenXeChain build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake ninja-build git python3 python3-yaml \
            autoconf automake libtool pkg-config bison flex gawk texinfo \
            bzip2 gzip grep findutils sed tar unzip zip openssl libssl-dev \
            zlib1g-dev libzstd-dev libgmp-dev libmpfr-dev libmpc-dev

      - name: Audit final source/build manifest and run host tests
        run: |
          python3 tools/audit_build_manifest.py
          python3 tools/audit_step4.py
          python3 tools/audit_openxechain_port.py
          bash tools/run_host_validation.sh

      - name: Restore OpenXeChain toolchain cache
        id: oxc-cache
        uses: actions/cache@v4
        with:
          path: .openxechain/sysroot
          key: openxechain-${{ runner.os }}-${{ env.OXC_BUILDSCRIPT_COMMIT }}

      - name: Build pinned OpenXeChain toolchain
        if: steps.oxc-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf .openxechain/buildscript
          mkdir -p .openxechain
          git clone https://github.com/OpenXeChain/buildscript.git .openxechain/buildscript
          cd .openxechain/buildscript
          git checkout "$OXC_BUILDSCRIPT_COMMIT"
          git submodule update --init --recursive
          PREFIX="$OXC_PREFIX" PARALLEL="$(nproc)" bash ./build-toolchain.sh

      - name: Build final XEX set
        run: |
          OPENXECHAIN_PREFIX="$OXC_PREFIX" bash ./build_openxechain.sh

      - name: Upload final app
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneTether360-1.0.0-OpenXeChain
          if-no-files-found: error
          path: |
            build/Loader.xex
            build/Loader.sha256
            build/Core.xex
            build/Core.sha256
            build/LicenseID.xex
            build/LicenseID.sha256
            build/BUILD_OUTPUTS.txt
            build/VERSION.txt
o "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "Restored state: llvm=$llvm complete=$complete"

      - name: Prepare pinned OpenXeChain source
        if: steps.oxc-state.outputs.complete != 'true'
        shell: bash
        run: |
          rm -rf .openxechain/buildscript
          mkdir -p .openxechain

          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

          git clone https://github.com/OpenXeChain/buildscript.git .openxechain/buildscript
          cd .openxechain/buildscript
          git checkout "$OXC_BUILDSCRIPT_COMMIT"
          git submodule sync --recursive
          git submodule update --init --recursive
          find . -type f -name '*.sh' -exec chmod +x {} \;

      - name: Build LLVM/Clang milestone with live log
        id: llvm-build
        if: steps.oxc-state.outputs.complete != 'true' && steps.oxc-state.outputs.llvm != 'true'
        continue-on-error: true
        shell: bash
        run: |
          cd .openxechain/buildscript

          python3 - <<'PY'
          from pathlib import Path

          src = Path("build-toolchain.sh").read_text()
          marker = 'echo -e "${TOOLCHAIN_STEM}Cross compiler built and installed!"\n'
          end = src.find(marker)

          if end < 0:
              raise SystemExit("Could not locate pinned OpenXeChain LLVM completion marker")

          end += len(marker)
          Path("build-llvm-stage.sh").write_text(src[:end] + "\nexit 0\n")
          PY

          chmod +x build-llvm-stage.sh
          : > build.log

          tail -n +1 -F build.log &
          tail_pid=$!

          set +e
          PREFIX="$OXC_PREFIX" PARALLEL="$(nproc)" bash ./build-llvm-stage.sh
          rc=$?
          set -e

          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true

          if [[ $rc -ne 0 ]]; then
            echo "LLVM/Clang stage failed with exit code $rc"
            echo "----- final build.log tail -----"
            tail -n 500 build.log || true
            exit "$rc"
          fi

          test -x "$OXC_PREFIX/bin/clang"
          test -x "$OXC_PREFIX/bin/clang++"
          test -x "$OXC_PREFIX/bin/lld-link"

      - name: Save LLVM/Clang milestone cache
        if: steps.llvm-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .openxechain/sysroot
          key: openxechain-partial-ubuntu24-${{ runner.arch }}-${{ env.OXC_CACHE_VERSION }}-${{ env.OXC_BUILDSCRIPT_COMMIT }}-llvm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload LLVM failure log
        if: steps.llvm-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: OpenXeChain-LLVM-build-log-${{ github.run_id }}
          if-no-files-found: warn
          path: .openxechain/buildscript/build.log

      - name: Stop after LLVM failure
        if: steps.llvm-build.outcome == 'failure'
        shell: bash
        run: |
          echo "LLVM stage failed. Its build log was preserved."
          exit 1

      - name: Build remaining OpenXeChain stages with Resizer-proven Newlib fix
        id: oxc-build
        if: steps.oxc-state.outputs.complete != 'true' && steps.llvm-build.outcome != 'failure'
        continue-on-error: true
        shell: bash
        run: |
          cd .openxechain/buildscript

          python3 - <<'PY'
          from pathlib import Path

          p = Path("build-toolchain.sh")
          s = p.read_text()

          start_marker = "# Configure it first\n"
          end_marker = 'echo -e "${TOOLCHAIN_STEM}Cross compiler built and installed!"\n'

          start = s.find(start_marker)
          end = s.find(end_marker, start)

          if start < 0 or end < 0:
              raise SystemExit("Could not locate pinned OpenXeChain LLVM build block")

          end += len(end_marker)
          original = s[start:end]

          replacement = (
              'if [[ -x "${PREFIX}/bin/clang" && -x "${PREFIX}/bin/lld-link" ]]; then\n'
              '    echo -e "${TOOLCHAIN_STEM}Restored LLVM/Clang detected; skipping cross-compiler rebuild."\n'
              'else\n'
              + original +
              'fi\n'
          )

          s = s[:start] + replacement + s[end:]

          old_cpp = '    CPP="${PREFIX}/bin/clang-cpp" \\\n'
          new_cpp = '    CPP="${PREFIX}/bin/clang-cpp --sysroot=${PREFIX} -I${PWD}/xecorelibtmp/include" \\\n'

          if old_cpp not in s:
              raise SystemExit("Could not locate pinned Newlib clang-cpp line")

          s = s.replace(old_cpp, new_cpp, 1)
          p.write_text(s)
          PY

          echo "Patched Newlib CPP:"
          grep -n 'CPP=.*clang-cpp' build-toolchain.sh

          : > build.log

          tail -n +1 -F build.log &
          tail_pid=$!

          set +e
          PREFIX="$OXC_PREFIX" PARALLEL="$(nproc)" bash ./build-toolchain.sh
          rc=$?
          set -e

          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true

          if [[ $rc -ne 0 ]]; then
            echo "OpenXeChain remainder failed with exit code $rc"
            echo "----- final build.log tail -----"
            tail -n 500 build.log || true

            while IFS= read -r diagnostic; do
              echo "----- $diagnostic -----"
              tail -n 500 "$diagnostic" || true
            done < <(find build -type f \( \
              -name 'config.log' -o \
              -name 'CMakeError.log' -o \
              -name 'CMakeOutput.log' \
            \) 2>/dev/null)

            exit "$rc"
          fi

      - name: Save partial OpenXeChain progress after later-stage failure
        if: steps.oxc-build.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: .openxechain/sysroot
          key: openxechain-partial-ubuntu24-${{ runner.arch }}-${{ env.OXC_CACHE_VERSION }}-${{ env.OXC_BUILDSCRIPT_COMMIT }}-later-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload OpenXeChain failure diagnostics
        if: steps.oxc-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: OpenXeChain-build-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .openxechain/buildscript/build.log
            .openxechain/buildscript/build/config.log
            .openxechain/buildscript/build/**/config.log
            .openxechain/buildscript/build/**/CMakeError.log
            .openxechain/buildscript/build/**/CMakeOutput.log

      - name: Stop after cached later-stage failure
        if: steps.oxc-build.outcome == 'failure'
        shell: bash
        run: |
          echo "Later OpenXeChain stage failed, but installed sysroot progress and diagnostics were saved first."
          exit 1

      - name: Verify completed OpenXeChain toolchain
        if: steps.oxc-state.outputs.complete != 'true'
        shell: bash
        run: |
          test -x "$OXC_PREFIX/bin/clang"
          test -x "$OXC_PREFIX/bin/clang++"
          test -x "$OXC_PREFIX/bin/lld-link"
          test -x "$OXC_PREFIX/bin/synthxex"
          test -f "$OXC_PREFIX/lib/xecorelib.a"
          test -f "$OXC_PREFIX/ppc-xbox360/lib/libc.a"
          test -f "$OXC_PREFIX/lib/generic/libclang_rt.builtins-powerpc.a"

          printf '#include <limits.h>\n' | \
            "$OXC_PREFIX/bin/clang-cpp" --sysroot="$OXC_PREFIX" >/dev/null

          echo "OpenXeChain toolchain verification passed."

      - name: Save complete OpenXeChain toolchain
        if: steps.oxc-state.outputs.complete != 'true' && steps.oxc-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .openxechain/sysroot
          key: openxechain-complete-ubuntu24-${{ runner.arch }}-${{ env.OXC_CACHE_VERSION }}-${{ env.OXC_BUILDSCRIPT_COMMIT }}

      - name: Build sysdll XEX
        id: target-build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p logs

          set +e
          OPENXECHAIN_PREFIX="$OXC_PREFIX" \
            bash ./build_openxechain.sh 2>&1 | tee logs/target-build.log
          rc=${PIPESTATUS[0]}
          set -e

          exit "$rc"

      - name: Upload target build log after failure
        if: steps.target-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneTether360-target-build-log-${{ github.run_id }}
          if-no-files-found: warn
          path: logs/target-build.log

      - name: Stop after target build failure
        if: steps.target-build.outcome == 'failure'
        shell: bash
        run: |
          echo "OpenXeChain toolchain is complete and cached; only the iPhoneTether360 target build failed."
          exit 1

      - name: Upload XEX
        if: steps.target-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneTether360-B9C-OpenXeChain
          if-no-files-found: error
          path: |
            build/iPhoneTether360-B9C-OXC.xex
            build/iPhoneTether360-B9C-OXC.sha256
